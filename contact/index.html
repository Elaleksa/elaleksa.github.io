<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
            name="description"
            content="Contact Elizaveta Aleksandrova — QA Engineer specializing in IAM testing."
    />

    <title>Contact | Elizaveta Aleksandrova</title>

    <style>
        * {
          box-sizing: border-box;
        }

        :root {
          --text: #151515;
          --muted: #6f7480;
          --border: #d7d7d7;
          --background: #ffffff;
          --button: #333333;
          --button-hover: #555555;
          --success: #166534;
          --max: 1180px;
        }

        body {
          margin: 0;
          min-height: 100svh;

          font-family: Inter, ui-sans-serif, -apple-system,
            BlinkMacSystemFont, "Segoe UI", sans-serif;

          background: var(--background);
          color: var(--text);

          display: flex;
          justify-content: center;
          align-items: center;

          padding:
            max(90px, env(safe-area-inset-top))
            max(24px, env(safe-area-inset-right))
            max(40px, env(safe-area-inset-bottom))
            max(24px, env(safe-area-inset-left));
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
          position: absolute;
          top: 0;
          left: 50%;
          transform: translateX(-50%);

          width: min(calc(100% - 48px), var(--max));

          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 24px;

          padding: 24px 0;

          font-size: 14px;
        }

        .brand {
          color: var(--text);
          font-weight: 800;
          text-decoration: none;
        }

        .back-link {
          color: var(--muted);
          text-decoration: none;

          transition: color 0.2s ease;
        }

        .back-link:hover {
          color: var(--text);
        }

        /* =========================
           CONTACT
        ========================= */

        .container {
          width: 100%;
          max-width: 460px;
          text-align: center;
        }

        h1 {
          margin: 0;

          font-size: clamp(26px, 6vw, 34px);
          letter-spacing: 0.04em;
        }

        .subtitle {
          margin: 10px auto 32px;
          max-width: 390px;

          color: var(--muted);
          font-size: 15px;
          line-height: 1.6;
        }

        form {
          display: flex;
          flex-direction: column;
          gap: 16px;

          text-align: left;
        }

        .field {
          width: 100%;
        }

        label {
          display: block;

          margin-bottom: 7px;

          font-size: 13px;
          font-weight: 600;
        }

        input,
        select,
        textarea {
          width: 100%;

          border: 1px solid var(--border);
          border-radius: 8px;

          background: #fff;
          color: var(--text);

          font: inherit;
          font-size: 16px;

          transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
        }

        input,
        select {
          height: 46px;
          padding: 0 12px;
        }

        textarea {
          min-height: 140px;
          padding: 12px;

          resize: vertical;
          line-height: 1.5;
        }

        input::placeholder,
        textarea::placeholder {
          color: #999;
        }

        select {
          cursor: pointer;
        }

        input:hover,
        select:hover,
        textarea:hover {
          border-color: #aaa;
        }

        input:focus,
        select:focus,
        textarea:focus {
          outline: none;

          border-color: var(--text);
          box-shadow: 0 0 0 3px rgba(21, 21, 21, 0.08);
        }

        button {
          width: 100%;
          min-height: 46px;

          margin-top: 4px;

          border: none;
          border-radius: 8px;

          background: var(--button);
          color: #fff;

          font: inherit;
          font-size: 15px;
          font-weight: 600;

          cursor: pointer;

          transition:
            background 0.2s ease,
            transform 0.1s ease;
        }

        button:hover {
          background: var(--button-hover);
        }

        button:active {
          transform: translateY(1px);
        }

        button:disabled {
          opacity: 0.65;
          cursor: wait;
        }

        .form-note {
          margin: 2px 0 0;

          color: var(--muted);
          font-size: 12px;
          line-height: 1.5;
          text-align: center;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
          display: none;

          margin-top: 24px;
          padding: 18px;

          border: 1px solid var(--border);
          border-radius: 8px;

          text-align: center;
        }

        .status.success {
          color: var(--success);
        }

        .status.error {
          color: #991b1b;
        }

        .status p {
          margin: 0;
          line-height: 1.5;
        }

        .status .back-link {
          display: inline-block;
          margin-top: 16px;

          color: var(--text);
          font-weight: 600;
        }

        @media (max-width: 520px) {
          body {
            align-items: flex-start;
            padding-top: 110px;
          }

          .topbar {
            width: calc(100% - 32px);
            padding: 20px 0;
          }

          .topbar .brand {
            font-size: 13px;
          }

          .topbar .back-link {
            font-size: 13px;
          }

          .subtitle {
            margin-bottom: 26px;
          }
        }
    </style>
</head>

<body>

<header class="topbar">
    <a class="brand" href="../">EA / CONTACT</a>
    <a class="back-link" href="../">← Back to profile</a>
</header>

<main class="container">

    <h1>LET'S CONNECT</h1>

    <p class="subtitle">
        Have a job opportunity, QA-related project, or just want to connect?
        Send me a message.
    </p>

    <form
            id="contact-form"
            action="https://formspree.io/f/mldpdwqv"
            method="POST"
    >

        <div class="field">
            <label for="name">Name</label>

            <input
                    id="name"
                    type="text"
                    name="name"
                    placeholder="Your name"
                    autocomplete="name"
                    maxlength="100"
                    required
            />
        </div>

        <div class="field">
            <label for="email">Email</label>

            <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    maxlength="150"
                    required
            />
        </div>

        <div class="field">
            <label for="topic">Topic</label>

            <select id="topic" name="topic" required>
                <option value="" disabled selected>Select a topic</option>
                <option value="Job opportunity">Job opportunity</option>
                <option value="QA collaboration">QA collaboration</option>
                <option value="Networking">Networking</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="field">
            <label for="message">Message</label>

            <textarea
                    id="message"
                    name="message"
                    placeholder="Tell me a little about what you'd like to discuss..."
                    maxlength="1500"
                    required
            ></textarea>
        </div>

        <!-- Helps Formspree identify the reply address -->
        <input
                type="hidden"
                name="_subject"
                value="New message from elaleksap.com"
        />

        <!-- Simple honeypot for bots -->
        <input
                type="text"
                name="_gotcha"
                tabindex="-1"
                autocomplete="off"
                style="display: none;"
        />

        <button id="submit-button" type="submit">
            Send message
        </button>

        <p class="form-note">
            I’ll receive your message by email.
        </p>

    </form>

    <div
            class="status success"
            id="success-message"
            role="status"
            aria-live="polite"
    >
        <p>
            Thanks — your message has been sent successfully.
        </p>

        <a href="../" class="back-link">
            Back to profile
        </a>
    </div>

    <div
            class="status error"
            id="error-message"
            role="alert"
            aria-live="assertive"
    >
        <p>
            Something went wrong. Please try again.
        </p>
    </div>

</main>

<script>
    const form = document.getElementById("contact-form");
    const submitButton = document.getElementById("submit-button");

    const successMessage =
      document.getElementById("success-message");

    const errorMessage =
      document.getElementById("error-message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      successMessage.style.display = "none";
      errorMessage.style.display = "none";

      submitButton.disabled = true;
      submitButton.textContent = "Sending...";

      const formData = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: formData,
          headers: {
            Accept: "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("Form submission failed");
        }

        form.reset();
        form.style.display = "none";

        successMessage.style.display = "block";
        successMessage.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      } catch (error) {
        errorMessage.style.display = "block";

      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Send message";
      }
    });
</script>

</body>
</html>
